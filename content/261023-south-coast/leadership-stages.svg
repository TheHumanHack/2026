<svg xmlns="http://www.w3.org/2000/svg" class="sc-diagram-svg" viewBox="0 0 1168 500" role="img" aria-label="Self-organization is built in stages: stabilize work, delegate decisions, and coach capability gaps">
<title>Self-organization is built in stages: stabilize work, delegate decisions, and coach capability gaps</title>
<path class="sc-diagram-draw" style="--sc-delay:0.15s" d="M174 38H994" fill="none" stroke="#CDDFE8" stroke-width="5" stroke-linecap="round" pathLength="1" data-id="sc-leadership-line"/><g class="sc-diagram-stage" style="--sc-delay:0.2s" data-id="sc-leadership-1"><circle cx="174" cy="38" r="28" fill="#008BEF" stroke="white" stroke-width="5"/><text x="174" y="46" class="sc-label sc-on-dark" style="font-size:22px;" text-anchor="middle" >1</text></g><g class="sc-diagram-stage" style="--sc-delay:0.3s" data-id="sc-survival"><text x="174" y="102" class="sc-label" style="font-size:19px;" text-anchor="middle" >SURVIVAL MODE</text></g><g class="sc-diagram-stage" style="--sc-delay:0.35s" data-id="sc-leadership-2"><circle cx="584" cy="38" r="28" fill="#008F80" stroke="white" stroke-width="5"/><text x="584" y="46" class="sc-label sc-on-dark" style="font-size:22px;" text-anchor="middle" >2</text></g><g class="sc-diagram-stage" style="--sc-delay:0.44999999999999996s" data-id="sc-learning"><text x="584" y="102" class="sc-label" style="font-size:19px;" text-anchor="middle" >LEARNING MODE</text></g><g class="sc-diagram-stage" style="--sc-delay:0.5s" data-id="sc-leadership-3"><circle cx="994" cy="38" r="28" fill="#1D2842" stroke="white" stroke-width="5"/><text x="994" y="46" class="sc-label sc-on-dark" style="font-size:22px;" text-anchor="middle" >3</text></g><g class="sc-diagram-stage" style="--sc-delay:0.6s" data-id="sc-organizing"><text x="994" y="102" class="sc-label" style="font-size:19px;" text-anchor="middle" >SELF-ORGANIZING</text></g><g class="sc-diagram-stage" style="--sc-delay:0.45s"><rect x="8" y="133" width="560" height="313" rx="22" fill="#EDF5FD" /><rect x="8" y="133" width="560" height="5" rx="2" fill="#008BEF" /><text x="34" y="176" class="sc-label" style="font-size:18px;" >SURVIVAL → LEARNING</text><text x="34" y="218" class="sc-label" style="font-size:19px;" >Make work visible</text><text x="34" y="250" class="sc-detail" style="font-size:19px;" >WIP limits  •  Fix-the-build  •  Code review</text><text x="34" y="275" class="sc-detail" style="font-size:19px;" >Small batches</text><path d="M34 294H542" stroke="#CDDFE8"/><text x="34" y="338" class="sc-label" style="font-size:19px;" >Run a stabilization sprint</text><text x="34" y="370" class="sc-detail" style="font-size:19px;" >Stop-the-line  •  Reduce WIP</text><text x="34" y="395" class="sc-detail" style="font-size:19px;" >Reinstate hard constraints</text></g><g class="sc-diagram-stage" style="--sc-delay:0.65s"><rect x="600" y="133" width="560" height="313" rx="22" fill="#EAF8F3" /><rect x="600" y="133" width="560" height="5" rx="2" fill="#008F80" /><text x="626" y="176" class="sc-label" style="font-size:18px;" >LEARNING → SELF-ORGANIZING</text><text x="626" y="218" class="sc-label" style="font-size:19px;" >Delegate decisions (RACI)</text><text x="626" y="250" class="sc-detail" style="font-size:19px;" >Define guardrails  •  Outcomes</text><text x="626" y="275" class="sc-detail" style="font-size:19px;" >Rotating ownership</text><path d="M626 294H1134" stroke="#CDDFE8"/><text x="626" y="338" class="sc-label" style="font-size:19px;" >Add coaching for new tech</text><text x="626" y="370" class="sc-detail" style="font-size:19px;" >or capability gaps</text><text x="626" y="395" class="sc-detail" style="font-size:19px;" >Pairing  •  Learning cadence</text></g><text x="584" y="484" class="sc-caption" style="font-size:14px;" text-anchor="middle" >Source: Roy Osherove, Elastic Leadership: Growing Self-Organizing Teams</text>
</svg>
