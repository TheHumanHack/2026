<svg xmlns="http://www.w3.org/2000/svg" class="sc-diagram-svg" viewBox="0 0 1168 500" role="img" aria-label="Dunning–Kruger effect: an illustrative confidence curve from Mount Stupid through the Valley of Despair and Slope of Enlightenment to the Plateau of Sustainability, as competence increases.">
  <title>Dunning–Kruger effect: competence and confidence</title>
  <rect x="82" y="24" width="1062" height="400" rx="22" fill="#F4F8FA"/>
  <g stroke="#DFE9EF" stroke-width="1"><path d="M100 110H1120M100 200H1120M100 290H1120"/><path d="M350 40V410M600 40V410M850 40V410" stroke-dasharray="4 8"/></g>
  <g class="sc-diagram-draw" fill="none" stroke="#1D2842" stroke-width="2.5"><path d="M100 40V424H1132" pathLength="1"/><path d="m94 52 6-12 6 12M1120 418l12 6-12 6" pathLength="1"/></g>
  <text x="32" y="240" text-anchor="middle" transform="rotate(-90 32 240)" class="sc-label" style="font-size:18px">Confidence</text>
  <text x="64" y="56" text-anchor="end" class="sc-caption">High</text><text x="64" y="414" text-anchor="end" class="sc-caption">Low</text>
  <text x="100" y="457" class="sc-detail">Know nothing</text><text x="1124" y="457" text-anchor="end" class="sc-detail">Guru</text>
  <text x="614" y="461" text-anchor="middle" class="sc-label">Competence</text>
  <path class="sc-diagram-fade" style="--sc-delay:1.1s" d="M108 418C123 330 140 101 169 107S200 371 300 365S596 169 768 116S996 83 1110 75V424H108Z" fill="#1BDBB0" opacity=".1"/>
  <path class="sc-diagram-draw" style="--sc-delay:.25s" d="M108 418C123 330 140 101 169 107S200 371 300 365S596 169 768 116S996 83 1110 75" fill="none" stroke="#008BEF" stroke-width="6" stroke-linecap="round" pathLength="1"/>
  <g class="sc-diagram-stage" style="--sc-delay:.55s"><circle cx="169" cy="107" r="8" fill="#008BEF" stroke="#FFF" stroke-width="4"/><text x="151" y="65" class="sc-label" style="font-size:18px">Peak of “Mount Stupid”</text><path d="M169 75V94" stroke="#008BEF" stroke-width="2"/></g>
  <g class="sc-diagram-stage" style="--sc-delay:.8s"><circle cx="300" cy="365" r="8" fill="#008BEF" stroke="#FFF" stroke-width="4"/><text x="330" y="391" class="sc-label" style="font-size:18px">Valley of Despair</text></g>
  <g class="sc-diagram-stage" style="--sc-delay:1.05s"><circle cx="647" cy="167" r="8" fill="#1BDBB0" stroke="#FFF" stroke-width="4"/><text x="585" y="272" class="sc-label" style="font-size:18px">Slope of Enlightenment</text><path d="M647 253V183" stroke="#1BDBB0" stroke-width="2"/></g>
  <g class="sc-diagram-stage" style="--sc-delay:1.3s"><circle cx="1070" cy="78" r="8" fill="#1BDBB0" stroke="#FFF" stroke-width="4"/><text x="1100" y="50" text-anchor="end" class="sc-label" style="font-size:17px">Plateau of Sustainability</text></g>
  <text x="1124" y="491" text-anchor="end" class="sc-caption" style="font-size:12px">Illustrative learning curve</text>
</svg>
