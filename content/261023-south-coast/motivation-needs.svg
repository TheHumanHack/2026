<svg xmlns="http://www.w3.org/2000/svg" class="sc-diagram-svg" viewBox="0 0 1168 500" role="img" aria-label="Motivation and human needs: Maslow’s five levels, alongside motivating factors and hygiene factors.">
  <title>Maslow’s hierarchy of needs and motivating versus hygiene factors</title>
